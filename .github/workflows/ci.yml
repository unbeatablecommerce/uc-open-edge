name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validation:
    name: All Checks Passed
    # This public repository accepts untrusted fork pull requests. Keep CI on
    # isolated GitHub-hosted runners rather than the private UC runner pool.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uc_open_edge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uc_open_edge_test
      SESSION_SECRET: test-session-secret-change-me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then base="${{ github.event.before }}"; fi
          files="$(git diff --name-only "$base" HEAD 2>/dev/null || git show --pretty='' --name-only HEAD)"
          if [[ -n "$files" ]] && ! grep -Ev '^(docs/|README[^/]*$|.*\.md$)' <<<"$files" >/dev/null; then echo "runtime=false" >> "$GITHUB_OUTPUT"; else echo "runtime=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma client
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        run: pnpm db:generate && pnpm db:validate
      - name: Build all packages
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        # Workspace consumers resolve generated declarations from dependency builds.
        run: pnpm build
      - name: Static checks
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        # SvelteKit sync runs during typecheck and creates the tsconfig consumed by ESLint.
        run: pnpm typecheck && pnpm lint
      - name: Run migrations and tests
        if: steps.changes.outputs.runtime == 'true' && github.event_name != 'push'
        run: pnpm db:migrate && pnpm test
